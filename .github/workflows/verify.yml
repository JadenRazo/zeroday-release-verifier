name: ZeroDay public release verifier
run-name: Verify public ${{ inputs.version }} probe ${{ inputs.probe_nonce }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public release version
        required: true
        type: string
      client_filename:
        description: Exact public client filename
        required: true
        type: string
      client_sha256:
        description: Exact public client SHA-256
        required: true
        type: string
      public_patch_notes_sha256:
        description: Canonical public patch-note object SHA-256
        required: true
        type: string
      probe_nonce:
        description: Random public probe identifier
        required: true
        type: string

permissions: {}

jobs:
  verify-public-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify exact production delivery
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CLIENT_FILENAME: ${{ inputs.client_filename }}
          CLIENT_SHA256: ${{ inputs.client_sha256 }}
          PUBLIC_PATCH_NOTES_SHA256: ${{ inputs.public_patch_notes_sha256 }}
          PROBE_NONCE: ${{ inputs.probe_nonce }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[1-9][0-9]*$ ]]
          [[ "$CLIENT_FILENAME" =~ ^zeroday-[A-Za-z0-9._-]+\.jar$ ]]
          [[ "$CLIENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PUBLIC_PATCH_NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROBE_NONCE" =~ ^[0-9a-f]{32}$ ]]

          public_base_url="http://174.129.211.253:8788"
          response_dir="$(mktemp -d)"
          trap 'rm -rf -- "$response_dir"' EXIT
          version_file="$response_dir/version.json"
          client_file="$response_dir/client.jar"

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 30 --retry 5 --retry-all-errors \
            --output "$version_file" "$public_base_url/version"
          jq -e \
            --arg version "$VERSION" \
            --arg filename "$CLIENT_FILENAME" \
            --arg sha256 "$CLIENT_SHA256" '
              type == "object"
              and .version == $version
              and .filename == $filename
              and .sha256 == $sha256
              and (.patchNotes | type == "object")
              and .patchNotes.schemaVersion == 1
              and .patchNotes.audience == "public"
            ' "$version_file" >/dev/null
          actual_notes_sha256="$(
            jq -cS '.patchNotes' "$version_file" | sha256sum | cut -d' ' -f1
          )"
          test "$actual_notes_sha256" = "$PUBLIC_PATCH_NOTES_SHA256"

          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 60 --retry 5 --retry-all-errors \
            --output "$client_file" "$public_base_url/download/zeroday.jar"
          test "$(sha256sum "$client_file" | cut -d' ' -f1)" = "$CLIENT_SHA256"

          printf 'ZERODAY_EXTERNAL_RECEIPT version=%s client_filename=%s client_sha256=%s public_patch_notes_sha256=%s nonce=%s\n' \
            "$VERSION" "$CLIENT_FILENAME" "$CLIENT_SHA256" \
            "$PUBLIC_PATCH_NOTES_SHA256" "$PROBE_NONCE"
